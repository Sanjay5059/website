<form method="POST" class="bg-gray-800 p-6 rounded shadow max-w-lg mx-auto">
    <h2 class="text-xl text-blue-300 font-semibold mb-4">Submit Leave Request 📝</h2>

    <label>Date</label>
    <input type="date" name="leave_date" required class="block w-full mb-3">

    <label>Number of Days</label>
    <input type="number" name="leave_days" min="1" max="5" required class="block w-full mb-3">

    <label>Leave Type</label>
    <select name="leave_type" required class="block w-full mb-3">
        <option value="Sick">Sick Leave</option>
        <option value="Casual">Casual Leave</option>
        <option value="Emergency">Emergency Leave</option>
    </select>

    <label>Reason</label>
    <textarea name="reason" rows="3" required class="block w-full mb-4"></textarea>

    <button type="submit" class="bg-blue-500 px-4 py-2 rounded text-white">Submit</button>
</form>


<!-- Submit Button -->
<button type="submit" class="bg-blue-500 px-4 py-2 rounded text-white w-full">Submit Request</button>
