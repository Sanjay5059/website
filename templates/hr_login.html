<!DOCTYPE html>
<html>
<head>
    <title>HR Portal Login</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white flex items-center justify-center h-screen">

<div class="w-full max-w-md bg-gray-800 p-8 rounded-lg shadow-lg">
    <h1 class="text-2xl font-bold mb-4 text-center">Sign in to <span class="text-blue-400">NexIQon HR portal</span></h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="text-sm text-{{ 'red' if category == 'error' else 'green' }}-500 mb-2">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
        <label class="block text-sm font-semibold mb-1">Username or email address</label>
        <input type="text" name="email" required class="w-full p-2 mb-4 rounded bg-gray-700 text-white border border-gray-600">

        <label class="block text-sm font-semibold mb-1">Password</label>
        <input type="password" name="password" required class="w-full p-2 mb-6 rounded bg-gray-700 text-white border border-gray-600">

        <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 rounded">Sign in</button>
    </form>
</div>

</body>
</html>
