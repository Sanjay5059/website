<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Leave Requests - NexIQon</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white p-10 min-h-screen">
    <h1 class="text-3xl font-bold text-blue-400 text-center mb-6">📅 Your Leave Requests</h1>

    <div class="max-w-4xl mx-auto">
        <table class="table-auto w-full text-left bg-gray-800 text-white rounded-lg">
            <thead>
                <tr class="text-blue-300">
                    <th class="p-2">Date</th>
                    <th class="p-2">Days</th>
                    <th class="p-2">Type</th>
                    <th class="p-2">Reason</th>
                    <th class="p-2">Status</th>
                </tr>
            </thead>
            <tbody>
                {% for leave in leaves %}
                <tr class="border-t border-gray-600">
                    <td class="p-2">{{ leave[0] }}</td>
                    <td class="p-2">{{ leave[1] }}</td>
                    <td class="p-2">{{ leave[2] }}</td>
                    <td class="p-2">{{ leave[3] }}</td>
                    <td class="p-2 font-semibold 
                        {% if leave[4] == 'Approved' %} text-green-400
                        {% elif leave[4] == 'Rejected' %} text-red-400
                        {% else %} text-yellow-300
                        {% endif %}
                    ">
                        {{ leave[4] }}
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="5" class="text-center p-4 text-gray-400">No leave requests found.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <div class="text-center mt-6">
            <a href="{{ url_for('employee_portal') }}" class="text-blue-400 hover:underline">← Back to Portal</a>
        </div>
    </div>
</body>
</html>
