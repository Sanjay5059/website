<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Submit Leave Request</title>
  <script>
    function showDateFields() {
      const numDays = document.getElementById("leave_days").value;
      const container = document.getElementById("date_fields");
      container.innerHTML = "";

      for (let i = 0; i < numDays; i++) {
        const label = document.createElement("label");
        label.innerText = "Leave Date " + (i + 1);
        label.className = "block mt-2 text-sm";

        const input = document.createElement("input");
        input.type = "date";
        input.name = "leave_date_" + i;
        input.required = true;
        input.className = "block w-full mt-1 rounded bg-gray-700 text-white p-2";

        container.appendChild(label);
        container.appendChild(input);
      }
    }
  </script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-gray-900 text-white p-10 min-h-screen">
  <div class="max-w-lg mx-auto bg-gray-800 p-6 rounded shadow-md">
    <h2 class="text-2xl font-bold text-blue-400 mb-4">Submit Leave Request</h2>

    <form method="POST">
      <label for="leave_days" class="block mb-1">Number of Leave Days:</label>
      <input type="number" id="leave_days" name="leave_days" min="1" max="10" required onchange="showDateFields()" class="w-full rounded p-2 bg-gray-700 text-white mb-4">

      <div id="date_fields"></div>

      <label for="leave_type" class="block mt-4 mb-1">Leave Type:</label>
      <select name="leave_type" required class="w-full rounded p-2 bg-gray-700 text-white mb-4">
        <option value="Sick Leave">Sick Leave</option>
        <option value="Casual Leave">Casual Leave</option>
        <option value="Paid Leave">Paid Leave</option>
      </select>

      <label for="reason" class="block mb-1">Reason:</label>
      <textarea name="reason" required class="w-full rounded p-2 bg-gray-700 text-white mb-4"></textarea>

      <button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 text-white py-2 rounded">Submit Request</button>
    </form>

    <!-- 📋 Leave Status + Back Links BELOW FORM -->
    <div class="mt-6 text-center text-sm text-blue-400 space-y-2">
      <a href="{{ url_for('leave_status') }}" class="hover:underline font-bold block">
        📋 Check Your Leave Status
      </a>
      <a href="{{ url_for('employee_portal') }}" class="hover:underline block">
        ← Back to Portal
      </a>
    </div>

  </div>
</body>
</html>
