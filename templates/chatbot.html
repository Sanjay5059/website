<!-- templates/chatbot.html -->
<div id="chatbot" class="fixed bottom-20 right-6 w-80 bg-white text-gray-900 rounded-lg shadow-lg hidden flex flex-col overflow-hidden z-50">
  <div class="bg-blue-600 text-white px-4 py-2 font-bold">IQonbot</div>
  <div id="chatbox" class="flex-1 p-3 space-y-2 overflow-y-auto max-h-64 text-sm"></div>
  <div class="flex border-t border-gray-300">
    <input id="userInput" type="text" placeholder="Type a message..." class="flex-1 p-2 text-sm focus:outline-none" onkeydown="if(event.key==='Enter') sendMessage()" />
    <button onclick="sendMessage()" class="px-3 bg-blue-600 text-white">➤</button>
  </div>
</div>
